name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build sitemap
        run: bun run sitemap
      - name: Validate sitemap & robots
        run: bun run validate:sitemap
      - name: Validate OG images
        run: bun run check:og
      - name: Validate JSON-LD structured data
        run: bun run validate:jsonld
      - name: Run tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Install Playwright (chromium)
        run: bun run e2e:install
      - name: Run E2E (a11y + flows + tracking)
        run: bun run e2e
      - name: Start preview server
        run: |
          bun run preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
      - name: Validate page images & alt text (/assistencia-tecnica-curitiba)
        run: bun scripts/check-page-images.ts
        env:
          PAGE_BASE_URL: http://localhost:4173

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright (chromium)
        run: bun run e2e:install
      - name: Guard — no service role in frontend
        run: |
          set -e
          if rg -n "SUPABASE_SERVICE_ROLE_KEY|service_role|serviceRole" src/ 2>&1 | rg -v "supabase/functions/"; then
            echo "::error::Service role reference found in frontend code — must live only in edge functions."
            exit 1
          fi
          echo "OK: no service role in src/"
      - name: Guard — no raw GPS coords in analytics/audit payloads
        run: |
          set -e
          # Coordenadas cruas (latitude/longitude/accuracy) só podem viver em
          # SmartLocationPrompt (persistência local) e reverseGeocode (helper).
          MATCHES=$(rg -n "latitude|longitude|\baccuracy\b" src/lib/analytics.ts src/lib/waAudit.ts src/lib/locationTelemetry.ts 2>/dev/null | rg -v "accuracy_bucket|// " || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Raw GPS coords leaked into analytics/audit code:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: no raw coords in analytics/audit code."
      - name: RLS E2E — wa_bypass_events policy
        run: bunx playwright test e2e/wa-bypass-rls.spec.ts --reporter=list
      - name: Upload RLS failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rls-e2e-trace
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7


  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x
      - name: Lighthouse — desktop (curitiba + brasil)
        run: lhci autorun --config=./lighthouserc.cjs
      - name: Lighthouse — mobile (curitiba + brasil)
        run: lhci autorun --config=./lighthouserc.mobile.cjs
      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 14
