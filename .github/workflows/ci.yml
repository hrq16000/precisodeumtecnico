name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build sitemap
        run: bun run sitemap
      - name: Validate OG images
        run: bun run check:og
      - name: Run tests
        run: bun run test
      - name: Build
        run: bun run build
