name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build sitemap
        run: bun run sitemap
      - name: Validate sitemap & robots
        run: bun run validate:sitemap
      - name: Validate OG images
        run: bun run check:og
      - name: Validate JSON-LD structured data
        run: bun run validate:jsonld
      - name: Run tests
        run: bun run test
      - name: Build
        env:
          BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
        run: bun run build
      - name: Guard — IndexNow key file publicado em dist/
        if: env.BING_INDEXNOW_KEY != ''
        env:
          BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
        run: |
          set -e
          if [ ! -f "dist/${BING_INDEXNOW_KEY}.txt" ]; then
            echo "::error::Arquivo dist/${BING_INDEXNOW_KEY}.txt ausente — build não publicou a verificação IndexNow."
            exit 1
          fi
          CONTENT=$(cat "dist/${BING_INDEXNOW_KEY}.txt")
          if [ "$CONTENT" != "$BING_INDEXNOW_KEY" ]; then
            echo "::error::Conteúdo do arquivo de verificação IndexNow não bate com a chave."
            exit 1
          fi
          echo "OK: arquivo de verificação IndexNow publicado."

      - name: Install Playwright (chromium)
        run: bun run e2e:install
      - name: Run E2E (a11y + flows + tracking)
        run: bun run e2e
      - name: Start preview server
        run: |
          bun run preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
      - name: Validate page images & alt text (/assistencia-tecnica-curitiba)
        run: bun scripts/check-page-images.ts
        env:
          PAGE_BASE_URL: http://localhost:4173

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright (chromium)
        run: bun run e2e:install
      - name: Guard — no service role in frontend
        run: |
          set -e
          if rg -n "SUPABASE_SERVICE_ROLE_KEY|service_role|serviceRole" src/ 2>&1 | rg -v "supabase/functions/"; then
            echo "::error::Service role reference found in frontend code — must live only in edge functions."
            exit 1
          fi
          echo "OK: no service role in src/"
      - name: Guard — no raw GPS coords in analytics payloads
        run: |
          set -e
          # Coordenadas cruas só podem viver em SmartLocationPrompt (persistência
          # local) e reverseGeocode (helper). Aqui garantimos que analytics e
          # auditoria não recebem lat/lng — bucket qualitativo é permitido.
          MATCHES=$(rg -n "latitude|longitude" src/lib/analytics.ts src/lib/waAudit.ts 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Raw GPS coords leaked into analytics/audit code:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: no raw coords in analytics/audit code."

      - name: RLS E2E — wa_bypass_events policy
        run: bunx playwright test e2e/wa-bypass-rls.spec.ts --reporter=list
      - name: Upload RLS failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rls-e2e-trace
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  submit-sitemap-gsc:
    # Pinga o Google Search Console quando o sitemap muda em main.
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect sitemap changes
        id: diff
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(public/sitemap|scripts/build-sitemap)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Submit sitemap to Google Search Console
        if: steps.diff.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL/ANON_KEY não configurados nos secrets do repo — pulando submit."
            exit 0
          fi
          curl -sS -X POST "$SUPABASE_URL/functions/v1/submit-sitemap-gsc" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /tmp/gsc.json
          grep -q '"ok":true' /tmp/gsc.json

  submit-sitemap-indexnow:
    # Pinga Bing/Yandex via IndexNow quando o sitemap muda em main.
    # Requer secrets do repo: SUPABASE_URL, SUPABASE_ANON_KEY.
    # A chave IndexNow em si vive como secret runtime (BING_INDEXNOW_KEY),
    # e o arquivo público /{KEY}.txt deve existir no domínio.
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect sitemap changes
        id: diff
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(public/sitemap|scripts/build-sitemap)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Submit sitemap via IndexNow (Bing/Yandex)
        if: steps.diff.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL/ANON_KEY não configurados — pulando IndexNow."
            exit 0
          fi
          HTTP_STATUS=$(curl -sS -o /tmp/indexnow.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/submit-sitemap-indexnow" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "IndexNow HTTP $HTTP_STATUS"
          cat /tmp/indexnow.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::IndexNow retornou HTTP $HTTP_STATUS"
            exit 1
          fi
          if ! grep -q '"ok":true' /tmp/indexnow.json; then
            echo "::error::Payload IndexNow não contém ok:true"
            exit 1
          fi
          echo "OK: sitemap submetido via IndexNow com sucesso."
      - name: Skip notice
        if: steps.diff.outputs.changed != 'true'
        run: echo "Sitemap não mudou nesse push — IndexNow não acionado."






  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x
      - name: Lighthouse — desktop (curitiba + brasil)
        run: lhci autorun --config=./lighthouserc.cjs
      - name: Lighthouse — mobile (curitiba + brasil)
        run: lhci autorun --config=./lighthouserc.mobile.cjs
      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 14
